<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magpie — Video Downloader</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="page">

        <main class="app">
            <header class="app-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
                        <path fill="currentColor" d="M22 14c-6 0-11 4-12 10l-4 8 6 1c1 6 6 10 12 10 5 0 9-3 11-7l9 4-2-7c2-2 3-5 3-8 0-6-5-11-11-11-3 0-5 1-7 2l-3-5-2 3z"/>
                        <path fill="currentColor" d="M28 22l10 6-10 6z"/>
                    </svg>
                    <span>Magpie</span>
                </div>
                <p class="tagline">Paste a link. Pick a quality. Done.</p>
            </header>

            <section class="input-section">
                <div class="input-row">
                    <input
                        id="url"
                        type="text"
                        placeholder="Paste a video link..."
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="fetch" class="btn">Fetch</button>
                </div>
                <p id="status" class="status"></p>
            </section>

            <section id="meta" hidden>
                <img id="thumb" alt="">
                <div class="meta-info">
                    <h2 id="title"></h2>
                    <p id="uploader" class="muted"></p>
                    <p id="duration" class="muted"></p>
                </div>
            </section>

            <section id="formats" hidden>
                <label for="format-select" class="muted">Choose quality</label>
                <div class="format-row">
                    <select id="format-select"></select>
                    <button id="download" class="btn">Download</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p class="muted">Personal use only. Respect copyright.</p>
        </footer>

    </div>

    <script src="/static/js/app.js"></script>

</body>
</html>
