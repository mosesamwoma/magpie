<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magpie — Video Downloader</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <main class="app">
        <header class="app-header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
                    <path fill="currentColor" d="M8 30c2-5 6-9 12-11 5-2 10-1 14 2l7-4-2 8c3 3 4 7 3 11-1 5-5 8-10 8-4 0-7-2-9-5-4 2-8 2-12 0l5-5-6-4z"/>
                    <rect fill="none" stroke="currentColor" stroke-width="2.5" x="38" y="42" width="18" height="13" rx="2"/>
                </svg>
                <span>Magpie</span>
            </div>
            <p class="tagline">Paste a link. Pick a quality. Done.</p>
        </header>

        <section class="input-section">
            <div class="input-row">
                <input
                    id="url"
                    type="text"
                    placeholder="Paste a video link..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="fetch" class="btn">Fetch</button>
            </div>
            <p id="status" class="status"></p>
        </section>

        <section id="meta" hidden>
            <img id="thumb" alt="">
            <div class="meta-info">
                <h2 id="title"></h2>
                <p id="uploader" class="muted"></p>
                <p id="duration" class="muted"></p>
            </div>
        </section>

        <section id="formats" hidden>
            <label for="format-select" class="muted">Choose quality</label>
            <div class="format-row">
                <select id="format-select"></select>
                <button id="download" class="btn">Download</button>
            </div>
        </section>

        <footer class="app-footer">
            <p class="muted">Personal use only. Respect copyright.</p>
        </footer>
    </main>

    <script src="../static/js/app.js"></script>

</body>
</html>
