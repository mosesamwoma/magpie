<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Paste a YouTube link, pick a quality, and download the video or just the audio as an MP3.">
<meta name="theme-color" content="#15171a" id="theme-color-meta">
<title>Magpie — Video &amp; Audio Downloader</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/magpie.svg') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magpie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
(function () {
  try {
    var saved = localStorage.getItem('magpie:theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="page">

  <div class="header-actions">
    <button id="history-btn" class="icon-btn" type="button" title="Download history">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 3"/>
      </svg>
    </button>
    <button id="theme-btn" class="icon-btn" type="button" title="Toggle theme">
      <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
      <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" hidden>
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>

  <header class="app-header">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="30" height="30">
        <path d="M 12 18 L 18 16 Q 22 12 28 14 C 36 18 40 26 42 32 L 50 41 L 48 43 L 40 37 Q 36 40 32 40 C 24 38 22 28 18 22 Z" fill="currentColor"/>
        <rect x="32" y="40" width="20" height="14" rx="2" fill="currentColor"/>
      </svg>
      <span>Magpie</span>
    </div>
    <div class="logo-rule"></div>
    <p class="tagline">Paste a link, keep the video — or just the sound.</p>
  </header>

  <main class="app">

    <section class="card url-card">
      <div class="input-row">
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
            <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
          </svg>
          <input
            id="url"
            type="text"
            placeholder="Paste a YouTube link…"
            autocomplete="off"
            spellcheck="false"
          >
          <button id="paste-btn" class="icon-btn" type="button" title="Paste from clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="8" y="2" width="8" height="4" rx="1"/>
              <path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/>
            </svg>
          </button>
          <button id="clear-btn" class="icon-btn" type="button" title="Clear" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
          <div id="recent-list" class="recent-list" hidden></div>
        </div>
        <button id="fetch" class="btn btn-primary">
          <span class="btn-label">Fetch</span>
          <span class="spinner" hidden></span>
        </button>
      </div>

      <div class="mode-toggle" role="tablist" aria-label="Download mode">
        <button class="mode-btn is-active" data-mode="video" role="tab" aria-selected="true" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="15" height="14" rx="2"/>
            <path d="m22 8-5 4 5 4Z"/>
          </svg>
          Video
        </button>
        <button class="mode-btn" data-mode="audio" role="tab" aria-selected="false" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          Audio (MP3)
        </button>
        <span class="mode-pill"></span>
      </div>

      <p id="status" class="status"></p>
    </section>

    <section id="result" class="card result-card" hidden>

      <div class="meta">
        <div class="thumb-wrap">
          <img id="thumb" alt="Video thumbnail">
          <span id="duration" class="duration-badge"></span>
          <button id="copy-thumb-btn" class="thumb-copy-btn" type="button" title="Copy thumbnail">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="12" height="12" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <div class="meta-info">
          <div class="title-row">
            <h2 id="title"></h2>
            <button id="copy-title-btn" class="icon-btn icon-btn-sm" type="button" title="Copy title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="12" height="12" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
          <p id="uploader" class="muted"></p>
          <p id="playlist-note" class="playlist-note" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
            </svg>
            This is a playlist — showing the first video only
          </p>
        </div>
      </div>

      <div class="format-block">
        <label for="format-select">Quality</label>
        <div id="format-filters" class="format-filters">
          <label class="filter-toggle">
            <input type="checkbox" id="mp4-only">
            MP4 only
          </label>
          <div class="select-wrap select-wrap-sm">
            <select id="max-quality">
              <option value="">Any quality</option>
              <option value="2160">Up to 4K</option>
              <option value="1440">Up to 1440p</option>
              <option value="1080">Up to 1080p</option>
              <option value="720">Up to 720p</option>
              <option value="480">Up to 480p</option>
            </select>
            <svg class="select-caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </div>
        </div>
        <div class="format-row">
          <div class="select-wrap">
            <select id="format-select"></select>
            <svg class="select-caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </div>
          <button id="download" class="btn btn-primary">
            <span class="btn-label">Download</span>
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v13m0 0-4-4m4 4 4-4M4 21h16"/>
            </svg>
          </button>
        </div>
        <div id="format-badges" class="format-badges" hidden></div>
      </div>

      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span id="progress-percent">0%</span>
          <span id="progress-size" class="muted"></span>
        </div>
        <button id="cancel-btn" class="cancel-link" type="button" hidden>Cancel download</button>
      </div>

    </section>

  </main>

  <footer class="app-footer">
    <p class="muted">Personal use only. Respect copyright.</p>
  </footer>

</div>

<div id="history-panel" class="history-overlay" hidden>
  <div class="history-panel">
    <div class="history-header">
      <h3>History</h3>
      <button id="history-close-btn" class="icon-btn" type="button" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="history-list" class="history-list"></div>
    <p id="history-empty" class="muted history-empty" hidden>Nothing downloaded yet.</p>
    <button id="history-clear-btn" class="cancel-link" type="button">Clear history</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
