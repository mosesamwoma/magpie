<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c0e">
<title>Magpie — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 1.5rem;
    background: #0b0c0e;
    color: #f1f2f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 360px;
  }
  .icon {
    color: #34a08d;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 1.3rem;
    margin-bottom: 0.6rem;
  }
  p {
    color: #90979e;
    font-size: 0.92rem;
    line-height: 1.5;
    margin-bottom: 1.4rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 0.65rem 1.4rem;
    border-radius: 999px;
    border: none;
    background: #34a08d;
    color: #08120f;
    cursor: pointer;
  }
  button:hover {
    background: #3fb89f;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 9a16 16 0 0 1 5-3.4M23 9a16 16 0 0 0-9-4.4M8.5 12.5a8 8 0 0 1 7 0M12 20h.01M5 16.5a12 12 0 0 1 3-2M19 16.5a12 12 0 0 0-3-2"/>
      <path d="M1 1l22 22"/>
    </svg>
    <h1>You're offline</h1>
    <p>Magpie needs a connection to fetch video info and download files. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
