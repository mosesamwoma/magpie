services:
  - type: web
    name: magpie
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: COOKIES_FROM_BROWSER
        value: ""